{% extends "base.html" %}
{% block title %}PyTM — Invoices{% endblock %}
{% block content %}

<div class="flex flex-1 overflow-hidden" x-data="invoiceForm()" @edit-invoice.window="prefill($event.detail)">

  <!-- ── Left: generate form ─────────────────────────────────────────────── -->
  <aside class="w-[30rem] bg-white border-r border-gray-200 overflow-y-auto p-5 flex flex-col gap-4">

    <div class="flex items-center justify-between">
      <h2 class="font-semibold text-gray-700" x-text="editing ? 'Regenerate Invoice #' + editingNum : 'Generate Invoice'"></h2>
      <button x-show="editing" @click="resetForm()"
              class="text-xs text-gray-400 hover:text-gray-600">✕ Cancel</button>
    </div>

    <form hx-post="/invoices/generate"
          hx-target="#invoice-list"
          hx-swap="innerHTML"
          hx-encoding="application/x-www-form-urlencoded"
          class="flex flex-col gap-3 text-sm">

      <div class="flex gap-2">
        <label class="w-32 text-gray-600 mt-1">#</label>
        <input name="invoice_number" type="text" x-model="invoiceNumber"
               class="flex-1 border border-gray-300 rounded px-2 py-1 focus:ring-2 focus:ring-indigo-400 focus:outline-none">
      </div>

      <div class="flex gap-2">
        <label class="w-32 text-gray-600 mt-1">Title</label>
        <input name="title" type="text" x-model="invoiceTitle"
               class="flex-1 border border-gray-300 rounded px-2 py-1 focus:ring-2 focus:ring-indigo-400 focus:outline-none">
      </div>

      <!-- Mode toggle -->
      <div class="flex items-center gap-3">
        <span class="text-gray-600">Mode:</span>
        <label class="flex items-center gap-1 cursor-pointer">
          <input type="radio" x-model="mode" value="project"> Projects
        </label>
        <label class="flex items-center gap-1 cursor-pointer">
          <input type="radio" x-model="mode" value="manual"> Manual
        </label>
      </div>

      <!-- Project-based -->
      <div x-show="mode === 'project'" class="flex flex-col gap-3">
        <div class="flex gap-2">
          <label class="w-32 text-gray-600 mt-1">Projects</label>
          <select name="project_keys" multiple
                  class="flex-1 border border-gray-300 rounded px-2 py-1 h-28 focus:ring-2 focus:ring-indigo-400 focus:outline-none text-xs">
            <option value="">— All billable —</option>
            {% for pname, proj in projects.items() %}
              {% if proj.get("meta", {}).get("billable", True) %}
              <option value="{{ pname }}">{{ proj.get("meta", {}).get("title") or pname }}</option>
              {% endif %}
            {% endfor %}
          </select>
        </div>
        <div class="flex gap-2">
          <label class="w-32 text-gray-600 mt-1">From</label>
          <input name="date_from" type="date" x-model="dateFrom"
                 class="flex-1 border border-gray-300 rounded px-2 py-1 focus:ring-2 focus:ring-indigo-400 focus:outline-none">
        </div>
        <div class="flex gap-2">
          <label class="w-32 text-gray-600 mt-1">To</label>
          <input name="date_to" type="date" x-model="dateTo"
                 class="flex-1 border border-gray-300 rounded px-2 py-1 focus:ring-2 focus:ring-indigo-400 focus:outline-none">
        </div>
        <input type="hidden" name="manual_tasks_json" value="">
      </div>

      <!-- Manual entry -->
      <div x-show="mode === 'manual'" class="flex flex-col gap-2">
        <input type="hidden" name="project_keys" value="">
        <input type="hidden" name="manual_tasks_json" :value="JSON.stringify(manualTasks)">
        <template x-for="(t, i) in manualTasks" :key="i">
          <div class="flex gap-1 items-center">
            <input type="text" placeholder="Task name" x-model="t.name"
                   class="w-28 border border-gray-300 rounded px-1 py-0.5 text-xs">
            <input type="number" placeholder="hrs" step="0.25" min="0" x-model="t.hours"
                   class="w-14 border border-gray-300 rounded px-1 py-0.5 text-xs">
            <input type="text" placeholder="desc" x-model="t.description"
                   class="flex-1 border border-gray-300 rounded px-1 py-0.5 text-xs">
            <button type="button" @click="manualTasks.splice(i,1)"
                    class="text-red-400 hover:text-red-600 text-xs">✕</button>
          </div>
        </template>
        <button type="button" @click="manualTasks.push({name:'',hours:0,description:''})"
                class="text-indigo-600 hover:underline text-xs text-left">+ Add task</button>
      </div>

      <div class="flex gap-2">
        <label class="w-32 text-gray-600 mt-1">Discount $</label>
        <input name="discount" type="number" step="0.01" x-model="discount"
               class="flex-1 border border-gray-300 rounded px-2 py-1 focus:ring-2 focus:ring-indigo-400 focus:outline-none">
      </div>

      <div class="flex gap-2">
        <label class="w-32 text-gray-600 mt-1">Footnote</label>
        <input name="foot_note" type="text" x-model="footNote"
               class="flex-1 border border-gray-300 rounded px-2 py-1 focus:ring-2 focus:ring-indigo-400 focus:outline-none">
      </div>

      <button class="bg-indigo-600 text-white rounded py-2 hover:bg-indigo-700 text-sm font-medium"
              x-text="editing ? 'Regenerate' : 'Generate'">
      </button>
    </form>
  </aside>

  <!-- ── Right: invoice list ──────────────────────────────────────────────── -->
  <div class="flex-1 overflow-y-auto p-6">
    <h2 class="font-semibold text-gray-700 mb-4">Invoice Records</h2>
    <div id="invoice-list"
         hx-get="/invoices" hx-trigger="load"
         hx-swap="innerHTML">
      <!-- populated by HTMX -->
    </div>
  </div>

</div>

<script>
function invoiceForm() {
  return {
    mode: 'project',
    manualTasks: [{name: '', hours: 0, description: ''}],
    invoiceNumber: '{{ next_invoice_number }}',
    invoiceTitle: 'Invoice',
    dateFrom: '',
    dateTo: '',
    discount: 0,
    footNote: 'Thank you for your business.',
    editing: false,
    editingNum: null,
    prefill(inv) {
      this.invoiceNumber = String(inv.number || '');
      this.invoiceTitle  = inv.title || 'Invoice';
      this.dateFrom      = inv.date_from || '';
      this.dateTo        = inv.date_to || '';
      this.discount      = inv.discount || 0;
      this.footNote      = inv.foot_note || 'Thank you for your business.';
      this.editing       = true;
      this.editingNum    = inv.number;
    },
    resetForm() {
      this.editing       = false;
      this.editingNum    = null;
      this.invoiceNumber = '{{ next_invoice_number }}';
      this.invoiceTitle  = 'Invoice';
      this.dateFrom      = '';
      this.dateTo        = '';
      this.discount      = 0;
    },
  }
}
</script>

{% endblock %}
