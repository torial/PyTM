{% extends "base.html" %}
{% block title %}PyTM — Projects{% endblock %}
{% block content %}
<script>
  document.addEventListener('alpine:init', () => {
    Alpine.store('ui', { selectedProject: null });
  });
</script>

<div class="flex flex-1 overflow-hidden">

  <!-- ── Left sidebar: project list ──────────────────────────────────────── -->
  <aside class="w-[28rem] bg-white border-r border-gray-200 flex flex-col overflow-y-auto"
         x-data="{ sort: 'name', filter: '' }">

    <!-- Header + new project form + sort controls -->
    <div class="p-4 border-b border-gray-200">
      <h2 class="font-semibold text-gray-700 mb-3">Projects</h2>
      <form hx-post="/projects" hx-target="#project-list" hx-swap="innerHTML"
            hx-on::after-request="this.reset()"
            class="flex gap-2">
        <input name="name" type="text" placeholder="New project…"
               class="flex-1 border border-gray-300 rounded px-2 py-1 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-400">
        <button class="bg-indigo-600 text-white px-3 py-1 rounded text-sm hover:bg-indigo-700">+</button>
      </form>
      <div class="flex items-center gap-1 mt-2">
        <span class="text-xs text-gray-400 mr-0.5">Sort:</span>
        <template x-for="[val, label] in [['name','A–Z'],['hours','Hours'],['updated','Updated']]" :key="val">
          <button
            @click="sort = val; $nextTick(() => htmx.trigger(document.getElementById('project-list'), 'sort-changed'))"
            :class="sort === val ? 'bg-indigo-100 text-indigo-700' : 'text-gray-400 hover:text-gray-600'"
            class="text-xs px-2 py-0.5 rounded"
            x-text="label">
          </button>
        </template>
      </div>
      <!-- Filter input -->
      <input type="text" x-model="filter" placeholder="Filter…"
             class="mt-2 w-full border border-gray-200 rounded px-2 py-1 text-xs text-gray-600 focus:outline-none focus:ring-1 focus:ring-indigo-300 placeholder-gray-300">
      <input type="hidden" id="project-sort-input" name="sort" :value="sort">
    </div>

    <!-- Project list — auto-loads and refreshes every 60 s; carries current sort -->
    <div id="project-list"
         hx-get="/projects"
         hx-include="#project-sort-input"
         hx-trigger="load, every 60s, sort-changed"
         hx-swap="innerHTML"
         class="flex-1 divide-y divide-gray-100">
      <!-- populated by HTMX -->
    </div>

  </aside>

  <!-- ── Main area ──────────────────────────────────────────────────────── -->
  <div class="flex-1 flex flex-col overflow-hidden">

    <!-- Active timer (pinned at top, shown when a task is running) -->
    <div id="active-timer">
      {% include "partials/active_timer.html" %}
    </div>

    <!-- Task panel — populated when a project row is clicked; auto-focuses task input -->
    <div id="task-panel" class="flex-1 overflow-y-auto p-6"
         hx-on:htmx:after-swap="$el.querySelector('input[name=name]')?.focus()">
      <p class="text-gray-400 text-sm">Select a project to see its tasks.</p>
    </div>

  </div>
</div>

{% endblock %}
